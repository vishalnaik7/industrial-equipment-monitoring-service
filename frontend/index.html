<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aurik Monitor</title>
    <meta name="description" content="Industrial equipment monitoring - machine operational attention view" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // apply saved theme before first paint (avoids a light flash in dark mode)
      try { const t = localStorage.getItem("aurik.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
