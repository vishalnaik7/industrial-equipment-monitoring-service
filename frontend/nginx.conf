# Serves the built React app and reverse-proxies the API, so the browser sees one origin (no CORS needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6m;               # backend rejects > MAX_BODY_BYTES (5 MB) with a proper 413 JSON error

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # API, probes and API docs -> backend service
  location ~ ^/(v1/|health$|ready$|docs|openapi\.json$) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Vite emits content-hashed file names, so assets can be cached forever. add_header in a location replaces
  # the server-level ones, so the security headers are repeated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Client-side routes (/machines/EQ-001, /trace/...) all serve the SPA shell.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    try_files $uri /index.html;
  }
}
